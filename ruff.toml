# Lint contract for CI.
#
# SCOPE IS DELIBERATELY INCREMENTAL. This repository carries a large body of
# unmaintained training experiments (bernouli_nb.py, qsvm.py, neko.py, tuning.py,
# logreg+clustering.py and ~15 more) that have never been linted. Enforcing any
# rule set across all of them would produce hundreds of findings unrelated to the
# code that is actually served, so `include` below names the governed files
# explicitly and `ruff check .` checks only those.
#
# Files outside `include` are UNLINTED, not blessed. Bringing one into scope is a
# separate, per-file task.

target-version = "py311"
line-length = 120

include = [
    "app.py",
    "inference_db.py",
    "admin_auth.py",
    "create_admin_user.py",
    "experiment_config.py",
    "conftest.py",
    "ml_core/**/*.py",
    "tests/**/*.py",
    "tools/**/*.py",
]

[lint]
# Pinned explicitly rather than relying on ruff's default selection, which has
# widened between releases and would otherwise make CI results drift when the
# pinned ruff version is bumped.
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "PIE",  # flake8-pie
    "RUF",  # ruff-specific rules
    "S",    # flake8-bandit (security)
    "BLE",  # flake8-blind-except
]

[lint.per-file-ignores]
# Conventional, deliberate exceptions for the test suite only. Production code
# is held to the full rule set above.
"tests/**" = [
    "S101",  # `assert` is how pytest expresses every check.
    "S603",  # subprocess calls are to sys.executable and git, with fixed argv.
    "S607",  # `git` is intentionally resolved from PATH.
    "S108",  # "/tmp/data.csv" is a string fed to a path parser, never touched.
    "S105",  # Test fixtures assign obvious dummy passwords by design; the
             # security suite needs literal credentials to assert against.
    "S106",  # Same, passed as arguments.
]
"conftest.py" = ["S101"]

# Previously deferred, enabled in the security track:
#
#   S (flake8-bandit) and BLE (flake8-blind-except) now apply to production
#   code. The four broad `except Exception` sites this file used to list were
#   resolved rather than suppressed:
#
#     * the optional Streamlit secrets lookup in inference_db.py splits into a
#       narrow ImportError plus one documented external-boundary catch, because
#       StreamlitSecretsFileNotFoundError has no importable public name. It is
#       the single remaining `# noqa: BLE001` in the governed scope, annotated
#       in place, and it logs only the exception type - never a database URL.
#     * both json.loads fallbacks narrowed to (ValueError, TypeError) and moved
#       into _decode_payload(), which still degrades one bad row to {} so a
#       single malformed record cannot fail an entire admin log listing.
#
#   S324 on hashlib.md5 in app.py is resolved with usedforsecurity=False: the
#   digest is unchanged and A/B bucketing stays stable, but the non-security
#   intent is now explicit.
