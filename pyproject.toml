[tool.mypy]
python_version = "3.11"
files = ["ml_core", "experiment_config.py", "tools"]
check_untyped_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_return_any = true
warn_unused_configs = true
show_error_codes = true

# These libraries do not publish complete PEP 561 typing metadata. The override
# is limited to import discovery; errors in this repository remain enabled.
[[tool.mypy.overrides]]
module = ["pandas", "sklearn.*"]
ignore_missing_imports = true

[tool.coverage.run]
branch = true
source = ["ml_core", "experiment_config"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 90
