[tool.mypy]
python_version = "3.11"
# The runtime joined this scope during the I-C/J integration, once the
# nineteen findings a diagnostic run surfaced were fixed rather than silenced.
# Nothing here is excluded, so "typechecked" means the served code, not a
# convenient subset of it.
files = [
    "ml_core",
    "research",
    "tools",
    "ui",
    "app.py",
    "admin_app.py",
    "admin_auth.py",
    "experiment_config.py",
    "inference_db.py",
    "streamlit_app.py",
]
check_untyped_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_return_any = true
warn_unused_configs = true
show_error_codes = true

# These libraries do not publish complete PEP 561 typing metadata. The override
# is limited to import discovery; errors in this repository remain enabled.
[[tool.mypy.overrides]]
module = ["pandas", "sklearn.*", "joblib", "scipy.*"]
ignore_missing_imports = true

# Track L's optional model-zoo frameworks. These are deliberately absent from
# both lockfiles: the zoo detects them at runtime, downgrades their registry
# entries to OPTIONAL, and records them as skipped. Typechecking a repository
# that is designed to work without them installed therefore cannot resolve the
# imports, and should not fail on that. The imports are inside the builder
# functions, so nothing here can execute at import time either.
[[tool.mypy.overrides]]
module = ["lightgbm", "catboost"]
ignore_missing_imports = true

[tool.coverage.run]
branch = true
source = ["ml_core", "experiment_config"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 90
