name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Single canonical runtime, pinned to the exact patch that the committed model
  # artifacts have been verified against. Deliberately not a matrix: claiming
  # untested versions pass would be dishonest. render.yaml, the Dockerfile and
  # the devcontainer track the same contract, enforced by
  # tests/test_config_contracts.py.
  PYTHON_VERSION: "3.11.16"
  # The python:X.Y-slim image tag is published per minor version only.
  PYTHON_MINOR: "3.11"

jobs:
  static:
    name: Lint and typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            requirements.lock
            requirements-dev.lock

      - name: Install reproducible dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.lock
          python -m pip install -r requirements-dev.lock

      - name: Verify dependency source-to-lock contract
        run: python tools/verify_dependency_contract.py

      - name: Report resolved runtime
        run: |
          python - <<'PY'
          import sys
          import joblib, numpy, pandas, scipy, shap, sklearn, xgboost
          print("python  ", sys.version.split()[0])
          for module in (sklearn, xgboost, numpy, scipy, pandas, joblib, shap):
              print(f"{module.__name__:8s}", module.__version__)
          PY

      - name: Lint governed scope
        # Scope and rule selection live in ruff.toml. `ruff check .` only visits
        # the files listed there; the unmaintained training experiments are
        # explicitly out of scope and documented as such.
        run: ruff check .

      - name: Typecheck owned stable modules
        run: python -m mypy

  test:
    name: Tests, artifacts, and training smoke
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          # Full history, not the default shallow tip. This job runs the
          # suite, and tests/test_config_contracts.py resolves every commit
          # CHANGELOG.md cites with `git cat-file`, so a fabricated
          # reference cannot pass review. Under fetch-depth 1 those
          # ancestors are simply absent from the checkout and the contract
          # fails on real, correct references.
          #
          # The other three jobs keep the shallow default: lint, typecheck,
          # the container smoke and the dependency audit all read the
          # working tree only.
          fetch-depth: 0

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            requirements.lock
            requirements-dev.lock

      - name: Install reproducible dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.lock
          python -m pip install -r requirements-dev.lock

      - name: Verify committed model artifacts load under the lock
        run: python -m pytest -q tests/test_artifact_compatibility.py

      - name: Verify committed artifact attestation
        # Fails if a serving artifact changed, disappeared, or was replaced
        # without regenerating the attestation. This is an integrity gate only -
        # it does not claim the artifacts' historical training provenance, which
        # was never recorded and is explicitly null in the attestation.
        run: |
          python tools/verify_provenance.py
          python tools/build_artifact_attestation.py --check

      - name: Run deterministic training smoke
        env:
          # Guarantee no test can reach a real database, even if a repository
          # secret named DATABASE_URL is ever added.
          DATABASE_URL: ""
        run: coverage run -m pytest -q tests/test_training_smoke.py

      - name: Run remaining test suite
        env:
          DATABASE_URL: ""
        # The training-smoke module ran immediately above. Together these two
        # invocations are the complete suite, without executing the fits twice.
        run: coverage run --append -m pytest -q --ignore=tests/test_training_smoke.py

      - name: Enforce maintained-module coverage ratchet
        # pyproject.toml owns the measured scope and conservative 90% floor.
        run: coverage report

      - name: Enforce Track K research coverage ratchet
        env:
          DATABASE_URL: ""
        # A SEPARATE gate with a separate config and a separate data file.
        # Research code never enters the maintained-module measurement above,
        # so it can neither dilute that 90% floor nor be quietly exempted from
        # having a floor of its own. coverage-research.toml owns both.
        run: |
          # Globbed, so a new Track K test module cannot escape measurement by
          # not being added to a hand-maintained list.
          # EVERY research package must be exercised here, not just Track K's.
          # coverage-research.toml measures source=["research"], so a package
          # whose tests are missing from this line reports 0% and sinks the
          # total. tests/test_config_contracts.py asserts the two stay in step.
          coverage run --rcfile=coverage-research.toml -m pytest -q tests/test_track_k_*.py tests/test_model_zoo_*.py tests/test_xai_*.py
          coverage report --rcfile=coverage-research.toml

      - name: Model-zoo registry and smoke
        env:
          DATABASE_URL: ""
          CUDA_VISIBLE_DEVICES: ""
        # Deliberately NOT the full thirty-model benchmark, which is explicit
        # research execution measured in minutes. What CI gates is that the
        # registry is coherent and the harness runs end to end: every spec
        # builds, the capability matrix generates, and a handful of
        # representative models complete a real 1,000-row fit against the
        # canonical data. A registry that no longer constructs is a broken
        # repository; a benchmark that takes twenty minutes is not a push gate.
        run: |
          python - <<'PY'
          from research.model_zoo.registry import REGISTRY
          from research.model_zoo.cards import capability_matrix, render_capability_table
          active = REGISTRY.active()
          print(f"registry: {len(REGISTRY)} models, {len(active)} active")
          assert len(REGISTRY) >= 25, "the zoo lost models"
          matrix = capability_matrix()
          assert len(matrix) == len(REGISTRY)
          rendered = render_capability_table(matrix)
          assert len(rendered.splitlines()) >= len(REGISTRY)
          print("capability matrix generates for every model")
          PY
          python -m research.model_zoo.run --train-rows 1000 --models logistic_l2 random_forest xgboost mlp nearest_centroid --output-root "${RUNNER_TEMP}/model_zoo"
          test -f "${RUNNER_TEMP}"/model_zoo/zoo-1000-*/run_manifest.json

      - name: Explainability capability contract and smoke
        env:
          DATABASE_URL: ""
          CUDA_VISIBLE_DEVICES: ""
        # Deliberately NOT the full explanation sweep, which is explicit
        # research execution measured in minutes. What CI gates is that the
        # capability contract stays coherent - every method's requirement
        # resolves against every model's profile, and every card still states
        # its limitations - and that the runner completes end to end on the
        # canonical data for one model per family and one method per kind.
        #
        # The representative slice is chosen to exercise all four outcome
        # paths: a supported global method, a supported local method, a
        # capability a model genuinely lacks, and a model with no ranking
        # score at all.
        run: |
          python - <<'PY'
          from research.model_zoo.contracts import ResearchStatus
          from research.model_zoo.registry import REGISTRY
          from research.xai import cards, run as xai_run
          from research.xai.capabilities import XaiCapability, build_profiles
          from research.xai.registry import METHODS

          profiles = build_profiles()
          assert set(profiles) == set(REGISTRY.ids()), "a model has no XAI profile"

          for method in METHODS:
              assert isinstance(method.required_capability, XaiCapability)
              assert method.failure_modes, f"{method.method_id} declares no limitation"

          active = [s for s in REGISTRY if s.effective_status() is ResearchStatus.ACTIVE]
          matrix = xai_run.plan()
          assert len(matrix) == len(active) * len(METHODS), "the plan lost pairs"
          assert any(row["supported"] for row in matrix), "nothing is explainable"
          assert any(not row["supported"] for row in matrix), "every gap vanished"
          for row in matrix:
              assert row["supported"] or row["reason"], "an unsupported pair gave no reason"

          counts = cards.coverage_counts()
          print(f"xai: {len(matrix)} pairs, coverage {counts}")
          assert counts["permutation_importance"] >= 20, "the cross-family baseline shrank"
          assert counts["gradient_compatible"] >= 5, "the gradient roster shrank"

          text = cards.render_all()
          assert cards.SCOPE_NOTE in text
          assert text.count("**Limitations.**") >= len(active), "a card lost its limitations"
          print("capability contract coherent; cards render for every model")
          PY
          python -m research.xai.run --train-rows 1000 --models logistic_l2 random_forest mlp nearest_centroid --methods coefficients native_importance permutation_importance occlusion integrated_gradients --case-limit 5 --eval-rows 400 --no-interactions --output-dir "${RUNNER_TEMP}/xai"
          test -f "${RUNNER_TEMP}"/xai/xai-1000-*/run_manifest.json

      - name: Deep-learning challenger smoke
        env:
          DATABASE_URL: ""
          # Prove the Track K stack is CPU-only by denying it a device even if
          # a GPU runner is ever used. The lock pins a +cpu wheel and
          # tests/test_dependency_contract.py forbids the CUDA packages; this
          # is the runtime half of the same guarantee.
          CUDA_VISIBLE_DEVICES: ""
        # Trains an MLP and an FT-Transformer end to end on the frozen split
        # with tiny configurations. It proves the research pipeline executes
        # under the locked runtime; its numbers are NOT research results, and
        # the manifest it writes says so. Output goes to the runner's temp
        # directory, outside the repository, so the clean-tree gate below is
        # measuring the test suite rather than this run.
        run: |
          python - <<'PY'
          import torch
          assert not torch.cuda.is_available(), "Track K must not require CUDA"
          assert torch.__version__.endswith("+cpu"), f"unexpected build: {torch.__version__}"
          print("torch", torch.__version__, "- CPU build, no device")
          PY
          python -m research.track_k.benchmark --smoke --output-root "${RUNNER_TEMP}/track_k"
          test -f "${RUNNER_TEMP}"/track_k/smoke-*/run_manifest.json

      - name: Compile and import smoke
        # The Streamlit entrypoints are now import-safe, so they are imported
        # here too: importing them must render no UI, load no model and write no
        # credentials. The clean-tree gate below is what proves the last part.
        run: |
          python -m compileall -q -x '\.(venv|git)' .
          python -c "import app, inference_db, admin_auth, create_admin_user; print('core import smoke ok')"
          python -c "import admin_app, streamlit_app; print('streamlit import smoke ok')"

      - name: No operational default credentials in tracked files
        # Security regression gate for the removed built-in administrator. The
        # sentinel is assembled at runtime so this workflow does not itself
        # contain the literal it forbids.
        run: |
          FORBIDDEN="admin""12345"
          if git grep -n --fixed-strings "$FORBIDDEN" -- . ':!tests/test_admin_security.py'; then
            echo "::error::A removed default credential is present in a tracked file."
            exit 1
          fi
          SEEDER="ensure_default""_admin"
          if git grep -n --fixed-strings "$SEEDER" -- . ':!tests/test_admin_security.py'; then
            echo "::error::Implicit administrator creation has returned."
            exit 1
          fi
          if git ls-files --error-unmatch admin_users.json data/admin_users.json 2>/dev/null; then
            echo "::error::A credential store is tracked in git."
            exit 1
          fi
          echo "No default credentials, no implicit admin creation, no tracked credential store."

      - name: Repository must be clean after the run
        run: |
          git diff --exit-code
          DIRTY="$(git status --porcelain)"
          if [ -n "$DIRTY" ]; then
            echo "::error::Working tree is dirty after tests. Generated files must be gitignored."
            echo "$DIRTY"
            exit 1
          fi
          echo "Working tree clean; ignored runtime output (__pycache__/, data/, .pytest_cache/) is expected."

  docker:
    name: Docker build and health smoke
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build image
        run: docker build --tag diabetes-api:ci .

      - name: Confirm image runtime matches the canonical version
        run: |
          IMAGE_PY="$(docker run --rm diabetes-api:ci python -c 'import sys; print("%d.%d" % sys.version_info[:2])')"
          echo "image python: ${IMAGE_PY}, expected: ${PYTHON_MINOR}"
          test "${IMAGE_PY}" = "${PYTHON_MINOR}"

      - name: Start container
        # DATABASE_URL is explicitly empty so the container falls back to local
        # SQLite. CI must never depend on Neon or any external PostgreSQL.
        run: |
          docker run --detach --name diabetes-api \
            --env DATABASE_URL= \
            --publish 8000:8000 \
            diabetes-api:ci

      - name: Wait for /health
        run: |
          for attempt in $(seq 1 60); do
            if curl --fail --silent --show-error http://localhost:8000/health -o health.json; then
              echo "healthy after ${attempt} attempt(s)"
              cat health.json
              exit 0
            fi
            sleep 2
          done
          echo "::error::Container never became healthy"
          docker logs diabetes-api || true
          exit 1

      - name: Assert health contract
        run: |
          python - <<'PY'
          import json
          body = json.load(open("health.json"))
          assert body["status"] == "ok", body
          assert body["model_bundle_exists"] is True, body
          assert body["boosted_bundle_exists"] is True, body
          print("health contract ok:", body)
          PY

      - name: Assert the container reports readiness
        run: |
          curl --fail --silent --show-error http://localhost:8000/ready -o ready.json
          cat ready.json
          python - <<'PY'
          import json
          body = json.load(open("ready.json"))
          assert body["status"] == "ready", body
          names = {c["name"] for c in body["checks"]}
          assert {"primary_model", "inference_log"} <= names, body
          assert all(c["ok"] for c in body["checks"] if c.get("required", True) is not False), body
          print("readiness contract ok:", body["status"])
          PY

      - name: Smoke a real prediction through the container
        run: |
          curl --fail --silent --show-error \
            --header 'Content-Type: application/json' \
            --data '{"GenHlth":3,"HighBP":1,"BMI":28.5,"HighChol":1,"Age":9,"DiffWalk":0,"HeartDiseaseorAttack":0,"PhysHlth":5,"Education":4,"PhysActivity":1}' \
            http://localhost:8000/predict -o predict.json
          python - <<'PY'
          import json
          body = json.load(open("predict.json"))
          assert body["prediction"] in (0, 1), body
          assert 0.0 <= body["probability"] <= 1.0, body
          assert body["risk_category"] in ("HIGH", "LOW"), body
          print("predict contract ok:", body["model_name"], body["probability"])
          PY

      - name: Container logs must show no serialization-version warning
        run: |
          docker logs diabetes-api > container.log 2>&1
          cat container.log
          if grep -Eq "InconsistentVersionWarning|older version of XGBoost" container.log; then
            echo "::error::Container logged a model serialization-version warning"
            exit 1
          fi

      - name: Container logs (on failure)
        if: failure()
        run: docker logs diabetes-api || true

      - name: Stop container
        if: always()
        run: docker rm --force diabetes-api || true

  audit:
    name: Dependency vulnerability audit
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install pip-audit
        run: python -m pip install pip-audit

      # Runs as its own job so a newly published advisory turns this red without
      # masking a genuine lint or test failure. It is deliberately NOT set to
      # continue-on-error: a vulnerable dependency should block and be triaged,
      # not silently ignored. Both locks were clean when this workflow landed.
      - name: Audit production lock
        run: pip-audit --no-deps --requirement requirements.lock

      - name: Audit development lock
        run: pip-audit --no-deps --requirement requirements-dev.lock
