# Coverage configuration for the Track K research package.
#
# Deliberately separate from pyproject.toml. The maintained core
# (ml_core, experiment_config) is gated at 90% and that gate is NOT touched
# here: folding research code into the same measurement would either let a
# well-covered research package mask a regression in the core, or force an
# aspirational floor onto exploratory code. Two scopes, two data files, two
# floors, both enforced in CI.
#
# The floor below was not chosen in advance. It was set from a measured run -
# 97% statement-and-branch coverage over 1,047 statements - and rounded down to
# leave room for honest variation. It is a ratchet: raising it as coverage
# improves is welcome, and lowering it is a deliberate act that shows up in
# review rather than a silent drift.
#
# Research code is not exempt from coverage. It is measured separately because
# it answers to a different question than serving code does.
[run]
branch = true
source = ["research"]
data_file = ".coverage.research"

[report]
show_missing = true
skip_covered = true
fail_under = 95
